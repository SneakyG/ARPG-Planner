name: Update data

on:
  schedule:
    - cron: '17 */3 * * *'   # giá item PoE, mỗi 3 giờ
    - cron: '41 22 * * *'    # toàn bộ nội dung, 05:41 sáng giờ Việt Nam
  workflow_dispatch:
    inputs:
      scope:
        description: 'Phạm vi cập nhật'
        type: choice
        options: [all, prices, meta]
        default: all
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/update.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCOPE: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 */3 * * *') && 'prices' || inputs.scope || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cập nhật dữ liệu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/update.js --scope "$SCOPE"
      - name: Cài trình duyệt để chụp ảnh cây Atlas
        if: env.SCOPE != 'prices'
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Chụp ảnh xem trước cho link farm
        if: env.SCOPE != 'prices'
        continue-on-error: true
        run: node scripts/snap.js
      - name: Lưu dữ liệu vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "Cập nhật dữ liệu $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
